name: Observstory

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  issues:
    types: [opened, closed, reopened, edited, assigned, unassigned]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pull-requests: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: observstory
  cancel-in-progress: true

jobs:
  observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hackathon observatory
        id: observstory
        uses: blackmath88/observstory@main
        with:
          config: observstory.config.json
          coordination: .observstory/coordination.json
          output: observstory

      - name: Assemble weekend cockpit
        run: |
          mv observstory/index.html observstory/project-map.html
          cp cockpit/index.html observstory/index.html
          cp planning/weekend.json observstory/data/weekend.json

      - name: Hackathon pulse
        run: |
          python3 - <<'PY'
          import json
          p = "observstory/data/snapshot.json"
          s = json.load(open(p))
          print("Repository:", s["repository"]["full_name"])
          print("In flight:", s["summary"]["in_flight"])
          print("Active areas:", s["summary"]["areas_active"])
          print("Signals:", s["summary"]["signals"])
          if s.get("coordination"):
              print("Declared coordination present")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sponge-squad-observatory
          path: observstory
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: observstory

  deploy:
    needs: observatory
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
